services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llm_monitor
      POSTGRES_USER: llm_monitor
      POSTGRES_PASSWORD: llm_monitor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_monitor -d llm_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
    ports:
      - "18080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./examples/config.compose.yaml:/config/config.yaml:ro
      - ./examples/embedding-fixture.txt:/config/embedding-fixture.txt:ro

  scheduler:
    build: .
    command: ["/app/llm-monitor-scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./examples/config.compose.yaml:/config/config.yaml:ro
      - ./examples/embedding-fixture.txt:/config/embedding-fixture.txt:ro

  worker:
    build: .
    command: ["/app/llm-monitor-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./examples/config.compose.yaml:/config/config.yaml:ro
      - ./examples/embedding-fixture.txt:/config/embedding-fixture.txt:ro

volumes:
  postgres-data:
  redis-data:
