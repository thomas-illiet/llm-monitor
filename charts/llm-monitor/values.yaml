replicaCount: 1

image:
  repository: ghcr.io/thomas-illiet/llm-monitor
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  port: 8080

gateway:
  enabled: false
  create: false
  annotations: {}
  parentRefs:
    - name: default
      # namespace: openshift-ingress
      # sectionName: http
  hostnames: []
  gatewayClassName: ""
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: ""
      allowedRoutes:
        namespaces:
          from: Same

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: monitor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

route:
  enabled: false
  annotations: {}
  host: ""
  tls: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

config:
  server:
    address: ":8080"

  postgres:
    dsn: "postgres://llm_monitor:llm_monitor@postgres.example.com:5432/llm_monitor?sslmode=require"

  target:
    name: "production-llm"
    base_url: "https://llm.example.com"
    http_check_path: "/v1/models"
    timeout: "30s"
    # ca_file: "/run/certs/llm-api-ca.crt"
    # api_key_file: "/run/secrets/target-api-key"
    retry:
      enabled: true
      max_retries: 2
      wait_min: "500ms"
      wait_max: "5s"

  auth:
    enabled: false
    token_url: "https://auth.example.com/oauth2/token"
    client_id: "llm-monitor"
    client_secret_file: "/run/secrets/oauth-client-secret"
    scopes:
      - "llm.read"
      - "llm.invoke"
    audience: "llm-service"
    timeout: "10s"
    refresh_skew: "30s"
    mtls:
      cert_file: "/run/certs/client.crt"
      # Base64-encoded data rendered into the cert Secret with --set-string.
      cert_file_data: ""
      key_file: "/run/certs/client.key"
      # Base64-encoded data rendered into the cert Secret with --set-string.
      key_file_data: ""
      ca_file: "/run/certs/ca.crt"

  smtp:
    enabled: false
    host: "smtp.example.com"
    port: 587
    username: "llm-monitor@example.com"
    # Set with --set-string config.smtp.password=... to render inline in config.yaml.
    # password: ""
    password_file: "/run/secrets/smtp-password"
    from: "llm-monitor@example.com"
    to:
      - "platform@example.com"
    starttls: true

  mcp:
    enabled: false
    path: "/mcp"
    # Set with --set-string config.mcp.bearer_token=... to render inline in config.yaml.
    # bearer_token: ""
    bearer_token_file: "/run/secrets/mcp-bearer-token"

  schedules:
    http_check: "30s"
    auth_check: "60s"
    model_snapshot: "5m"
    model_runs: "15m"

  retention:
    history: "90d"

  models:
    absence_alert_after: "24h"
    max_concurrency: 4

  tests:
    chat_prompts:
      - id: "short-answer"
        prompt: "Answer in one short sentence: what is observability?"
        max_tokens: 64
        temperature: 0
      - id: "json-smoke"
        prompt: "Return a JSON object with keys status and timestamp."
        max_tokens: 96
        temperature: 0
    embedding_fixture:
      path: "/config/embedding-fixture.txt"
      max_bytes: 4096

  dashboard:
    site_name: "LLM Service Monitor"
    site_url: "https://monitor.example.com"
    default_window: "24h"
    slo:
      ttft_p99_ms: 200
      itl_p99_ms: 50
      request_latency_p99_ms: 3000

secretFiles:
  data: {}
  # data:
  #   target-api-key: "replace-me"
  #   oauth-client-secret: "replace-me"
  #   smtp-password: "replace-me"
  #   mcp-bearer-token: "replace-me"

certFiles:
  data: {}
  # data:
  #   llm-api-ca.crt: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----
  #   client.crt: ""
  #   client.key: ""
  #   ca.crt: ""

embeddingFixture:
  enabled: true
  content: |
    This fixture is used by scheduled embedding probes.
