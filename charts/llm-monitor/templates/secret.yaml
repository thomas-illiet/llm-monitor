{{- $mtls := .Values.config.auth.mtls | default dict -}}
{{- $certFileData := $mtls.cert_file_data | default "" -}}
{{- $keyFileData := $mtls.key_file_data | default "" -}}
{{- $hasMTLSData := or $certFileData $keyFileData -}}
{{- $hasCertFiles := or .Values.certFiles.data $hasMTLSData -}}
{{- if $hasCertFiles }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-monitor.fullname" . }}-cert-files
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.certFiles.data }}
stringData:
  {{- range $key, $value := .Values.certFiles.data }}
  {{ $key }}: |-
{{ $value | indent 4 }}
  {{- end }}
{{- end }}
{{- if $hasMTLSData }}
data:
  {{- if $certFileData }}
  {{ base ($mtls.cert_file | default "/run/certs/client.crt") | quote }}: {{ $certFileData | quote }}
  {{- end }}
  {{- if $keyFileData }}
  {{ base ($mtls.key_file | default "/run/certs/client.key") | quote }}: {{ $keyFileData | quote }}
  {{- end }}
{{- end }}
{{- end }}
