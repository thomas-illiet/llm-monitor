{{- if and .Values.gateway.enabled .Values.gateway.create -}}
{{- $gatewayClassName := required "gateway.gatewayClassName is required when gateway.create=true" .Values.gateway.gatewayClassName -}}
{{- $parentRefs := required "gateway.parentRefs must contain at least one parent reference when gateway.create=true" .Values.gateway.parentRefs -}}
{{- $gatewayName := required "gateway.parentRefs[0].name is required when gateway.create=true" (index (index $parentRefs 0) "name") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gatewayClassName | quote }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ required "gateway.listeners[].name is required when gateway.create=true" .name }}
      protocol: {{ required "gateway.listeners[].protocol is required when gateway.create=true" .protocol }}
      port: {{ required "gateway.listeners[].port is required when gateway.create=true" .port }}
      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with .tls }}
      tls:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .allowedRoutes }}
      allowedRoutes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
