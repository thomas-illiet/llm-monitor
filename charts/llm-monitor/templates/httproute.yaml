{{- if .Values.gateway.enabled -}}
{{- $parentRefs := required "gateway.parentRefs must contain at least one parent reference when gateway.enabled=true" .Values.gateway.parentRefs -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "llm-monitor.fullname" . }}
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "llm-monitor.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
