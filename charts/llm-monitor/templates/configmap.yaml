{{- $postgresDsn := required "config.postgres.dsn is required" .Values.config.postgres.dsn -}}
{{- $providers := required "config.providers is required" .Values.config.providers -}}
{{- range $index, $provider := $providers }}
{{- $_ := required (printf "config.providers[%d].base_url is required" $index) $provider.base_url -}}
{{- end }}
{{- $config := deepCopy .Values.config -}}
{{- range $config.providers }}
{{- $_ := unset . "api_key_file" -}}
{{- with .auth }}
{{- $_ := unset . "client_secret_file" -}}
{{- with .mtls }}
{{- $_ := unset . "cert_file_data" -}}
{{- $_ := unset . "key_file_data" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- with $config.smtp }}
{{- $_ := unset . "password_file" -}}
{{- end -}}
{{- with $config.mcp }}
{{- $_ := unset . "bearer_token_file" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-monitor.fullname" . }}-config
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml $config | indent 4 }}
  {{- if .Values.embeddingFixture.enabled }}
  embedding-fixture.txt: |
{{ .Values.embeddingFixture.content | indent 4 }}
  {{- end }}
