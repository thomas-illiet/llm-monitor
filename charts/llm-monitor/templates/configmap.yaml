{{- $postgresDsn := required "config.postgres.dsn is required" .Values.config.postgres.dsn -}}
{{- $targetBaseURL := required "config.target.base_url is required" .Values.config.target.base_url -}}
{{- $config := deepCopy .Values.config -}}
{{- with $config.auth.mtls }}
{{- $_ := unset . "cert_file_data" -}}
{{- $_ := unset . "key_file_data" -}}
{{- end -}}
{{- if not $config.smtp.enabled }}
{{- $_ := unset $config.smtp "password_file" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-monitor.fullname" . }}-config
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml $config | indent 4 }}
  {{- if .Values.embeddingFixture.enabled }}
  embedding-fixture.txt: |
{{ .Values.embeddingFixture.content | indent 4 }}
  {{- end }}
