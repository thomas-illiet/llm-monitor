{{- $hasMTLSData := false -}}
{{- range (.Values.config.providers | default list) -}}
{{- $mtls := .auth.mtls | default dict -}}
{{- if or ($mtls.cert_file_data | default "") ($mtls.key_file_data | default "") -}}
{{- $hasMTLSData = true -}}
{{- end -}}
{{- end -}}
{{- $hasCertFiles := or .Values.certFiles.data $hasMTLSData -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-monitor.fullname" . }}
  labels:
    {{- include "llm-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "llm-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $hasCertFiles }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llm-monitor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "llm-monitor.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "llm-monitor.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: LLM_MONITOR_CONFIG
              value: /config/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if $hasCertFiles }}
            - name: cert-files
              mountPath: /run/certs
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-monitor.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
              {{- if .Values.embeddingFixture.enabled }}
              - key: embedding-fixture.txt
                path: embedding-fixture.txt
              {{- end }}
        {{- if $hasCertFiles }}
        - name: cert-files
          secret:
            secretName: {{ include "llm-monitor.fullname" . }}-cert-files
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
