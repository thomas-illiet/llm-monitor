<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">LLM Service Monitor</title>
  <desc id="desc">Banner showing an observability dashboard for OpenAI-compatible LLM services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f7f4"/>
      <stop offset="0.55" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#101828" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <path d="M0 300 C 210 255, 312 342, 514 292 C 710 244, 852 286, 1028 238 C 1134 210, 1210 218, 1280 190 L1280 360 L0 360 Z" fill="#d8ede6"/>
  <g filter="url(#shadow)">
    <rect x="700" y="56" width="430" height="248" rx="18" fill="#ffffff"/>
    <rect x="728" y="84" width="154" height="58" rx="12" fill="#e7f7f1"/>
    <rect x="900" y="84" width="96" height="58" rx="12" fill="#eff6ff"/>
    <rect x="1014" y="84" width="88" height="58" rx="12" fill="#fff7df"/>
    <path d="M740 224 L790 198 L842 210 L894 162 L946 184 L998 134 L1054 152 L1102 120" fill="none" stroke="#10a37f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M740 254 L790 242 L842 246 L894 218 L946 230 L998 192 L1054 204 L1102 174" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1102" cy="120" r="9" fill="#10a37f"/>
    <circle cx="1102" cy="174" r="7" fill="#2563eb"/>
  </g>
  <g>
    <rect x="104" y="78" width="70" height="70" rx="18" fill="#10a37f"/>
    <path d="M124 113 h30 M139 98 v30" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <text x="104" y="202" fill="#202123" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="760">LLM Service Monitor</text>
    <text x="106" y="244" fill="#475467" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Availability, latency, tokens, and alerts.</text>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">
