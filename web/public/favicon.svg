<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">LLM Service Monitor</title>
  <desc id="desc">A compact status dashboard icon with a live activity trace.</desc>
  <defs>
    <linearGradient id="bg" x1="32" x2="224" y1="22" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24262f" offset="0" />
      <stop stop-color="#202123" offset="0.52" />
      <stop stop-color="#102f2a" offset="1" />
    </linearGradient>
    <radialGradient id="glow" cx="68" cy="58" r="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53f0c3" stop-opacity="0.72" offset="0" />
      <stop stop-color="#38bdf8" stop-opacity="0.28" offset="0.52" />
      <stop stop-color="#10a37f" stop-opacity="0" offset="1" />
    </radialGradient>
    <linearGradient id="panel" x1="54" x2="202" y1="52" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.98" offset="0" />
      <stop stop-color="#ecfff8" stop-opacity="0.9" offset="1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.34" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)" />
  <rect width="256" height="256" rx="58" fill="url(#glow)" />
  <path d="M42 168c29 19 66 24 108 14 33-8 56-4 69 12v62H42Z" fill="#10a37f" opacity="0.13" />

  <g filter="url(#softShadow)">
    <rect x="44" y="48" width="168" height="160" rx="34" fill="url(#panel)" />
    <rect x="44" y="48" width="168" height="160" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="3" />
  </g>

  <circle cx="82" cy="88" r="9" fill="#10a37f" />
  <circle cx="112" cy="88" r="9" fill="#38bdf8" />
  <circle cx="142" cy="88" r="9" fill="#f59e0b" />
  <path d="M70 150h23l18-42 28 76 23-58h25" fill="none" stroke="#202123" stroke-linecap="round" stroke-linejoin="round" stroke-width="15" />
  <path d="M70 150h23l18-42 28 76 23-58h25" fill="none" stroke="#10a37f" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" />
  <circle cx="111" cy="108" r="8" fill="#202123" />
  <circle cx="139" cy="184" r="8" fill="#202123" />
  <circle cx="162" cy="126" r="8" fill="#202123" />
</svg>
