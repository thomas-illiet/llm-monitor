server:
  address: ":8080"

postgres:
  dsn: "postgres://llm_monitor:llm_monitor@postgres:5432/llm_monitor?sslmode=disable"

target:
  name: "local-ollama"
  base_url: "http://host.docker.internal:11434"
  http_check_path: "/v1/models"
  timeout: "120s"

auth:
  enabled: false

smtp:
  enabled: true
  host: "maildev"
  port: 1025
  from: "llm-monitor@local.test"
  to:
    - "platform@local.test"
  starttls: false

mcp:
  enabled: true
  path: "/mcp"
  bearer_token: "dev-mcp-token"

schedules:
  http_check: "30s"
  auth_check: "60s"
  model_snapshot: "5m"
  model_runs: "1m"

retention:
  history: "90d"

models:
  absence_alert_after: "24h"
  max_concurrency: 1

tests:
  chat_prompts:
    - id: "short-answer"
      prompt: "Answer in one short sentence: what is observability?"
      max_tokens: 64
      temperature: 0
  embedding_fixture:
    path: "/config/embedding-fixture.txt"
    max_bytes: 4096

dashboard:
  site_name: "Local LLM Monitor"
  site_url: "http://localhost:18080"
  default_window: "24h"
  slo:
    ttft_p99_ms: 200
    itl_p99_ms: 50
    request_latency_p99_ms: 3000
